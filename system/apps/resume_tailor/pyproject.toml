[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor your resume to a job posting, step by step"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "pydantic>=2",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "markdown>=3.6",
]

[project.scripts]
resume-tailor = "resume_tailor.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]
