[program:resume-tailor]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/resume_tailor/app.toml --url http://localhost:8082 && exec resume-tailor"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/resume-tailor-stdout.log
stderr_logfile=/var/log/supervisor/resume-tailor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
